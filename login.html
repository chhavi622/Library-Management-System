<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | LibraSys</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <!-- Background Decoration -->
    <div class="login-bg"></div>

    <!-- Left Library Decoration -->
    <div class="login-photo left-photo"></div>

    <!-- Right Library Decoration -->
    <div class="login-photo right-photo"></div>


    <!-- =========================
         LOGIN CARD
    ========================== -->

    <section class="login-panel">

        <!-- Logo -->
        <div class="login-brand">

            <div class="big-book">
                📚
            </div>

            <div>
                <h1>LIBRARY</h1>

                <h2>
                    MANAGEMENT SYSTEM
                </h2>
            </div>

        </div>


        <!-- Decorative Line -->
        <div class="login-line">

            <span></span>

            ✦

            <span></span>

        </div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form
            class="login-form"
            action="index.html"
            method="get"
        >

            <!-- USERNAME -->

            <div class="login-field">

                <label for="username">
                    User Name
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your user name"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="login-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- OPTIONS -->

            <div class="remember">

                <label>

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>


                <a href="#">
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="login-footer">

            📖 Smart Library Management System

            <br>

            Manage books, members and
            transactions with ease.

            <br><br>

            © 2026 LibraSys.
            All rights reserved.

        </div>

    </section>

</body>

</html>
